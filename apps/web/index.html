<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#158296" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>MyDexPoGo</title>
    <script>
      try {
        var t = localStorage.getItem('theme');
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
        var tm = localStorage.getItem('team');
        var bars = {
          none: ['#158296', '#1f6d7c'],
          mystic: ['#1d63c4', '#1b4f9c'],
          valor: ['#cc2f3b', '#a82435'],
          instinct: ['#c98300', '#9a6508'],
          rocket: ['#31224a', '#4d1f7a'],
          sakura: ['#c43b78', '#9c2b63'],
          forest: ['#176b49', '#1a5c41'],
          oled: ['#262c36', '#0c111d']
        };
        if (tm && tm !== 'none' && bars[tm]) document.documentElement.dataset.team = tm;
        var pair = bars[tm] || bars.none;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', d ? pair[1] : pair[0]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
