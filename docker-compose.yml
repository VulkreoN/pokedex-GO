name: mydexpogo
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mydex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydex}
      POSTGRES_DB: mydex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydex -d mydex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mydex:${POSTGRES_PASSWORD:-mydex}@db:5432/mydex
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data
      DATA_REFRESH_HOURS: ${DATA_REFRESH_HOURS:-6}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      NEWS_LOCALES: ${NEWS_LOCALES:-fr}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNELS: ${DISCORD_CHANNELS:-}
      FEED_POLL_MINUTES: ${FEED_POLL_MINUTES:-5}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Set DOMAIN (e.g. dex.example.com) and Caddy gets a Let's Encrypt certificate by itself.
      DOMAIN: ${DOMAIN:-}
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
