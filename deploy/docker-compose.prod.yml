# Production on a VPS: images built by CI (GitHub Container Registry), HTTPS by Caddy on the domain.
# Lives in /opt/mydexpogo next to .env; deploy.sh sets TAG to the commit being released.
name: mydexpogo
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mydex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mydex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydex -d mydex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/vulkreon/pokedex-go}-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mydex:${POSTGRES_PASSWORD}@db:5432/mydex
      PORT: "3000"
      COOKIE_SECURE: "true"
      DATA_DIR: /data
      DATA_REFRESH_HOURS: ${DATA_REFRESH_HOURS:-6}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      NEWS_LOCALES: ${NEWS_LOCALES:-fr}
      FEED_POLL_MINUTES: ${FEED_POLL_MINUTES:-5}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/vulkreon/pokedex-go}-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      # Caddy gets and renews the Let's Encrypt certificate for this name by itself (ports 80 and 443 open).
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
