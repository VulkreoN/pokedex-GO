# The API: runs its migrations on start, builds the Pokédex dataset into /data (kept on a volume), sends pushes.
# One replica: live updates (SSE) and timers live in the process. On a release the new pod starts next to the old one
# and takes over once ready, so the site does not go down. ReadWriteOnce is per node: fine on a single-node cluster;
# on several nodes, pin the pod to one (nodeSelector) or switch back to the Recreate strategy.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appdata
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: ghcr.io/vulkreon/pokedex-go-api
          envFrom:
            - configMapRef:
                name: mydexpogo-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mydexpogo-secrets
                  key: postgres-password
            # Kubernetes expands $(POSTGRES_PASSWORD): the password must be URL-safe (hex), see README.md.
            - name: DATABASE_URL
              value: postgres://mydex:$(POSTGRES_PASSWORD)@db:5432/mydex
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mydexpogo-secrets
                  key: github-token
                  optional: true
            - name: PORT
              value: "3000"
            - name: COOKIE_SECURE
              value: "true"
            - name: DATA_DIR
              value: /data
          ports:
            - containerPort: 3000
          # A few seconds for the ingress to stop sending traffic here before the API is asked to stop.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          # Migrations and the first dataset build can take a few minutes on a fresh volume.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: appdata
              mountPath: /data
      volumes:
        - name: appdata
          persistentVolumeClaim:
            claimName: appdata
