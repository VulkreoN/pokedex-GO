# MyDexPoGo on Kubernetes, synced by ArgoCD (see ../argocd/application.yaml and README.md).
# CI writes the released commit into the two newTag lines below; nothing else here changes on a release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mydexpogo
labels:
  - pairs:
      app.kubernetes.io/part-of: mydexpogo
resources:
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - backup.yaml
configMapGenerator:
  - name: mydexpogo-config
    literals:
      - ADMIN_USERNAMES=vulk
      - DATA_REFRESH_HOURS=6
      - NEWS_LOCALES=fr
      - FEED_POLL_MINUTES=5
      # Contact given to the push services (Google, Apple, Mozilla) in case of trouble: mailto: or the site's https URL.
      - VAPID_SUBJECT=https://dex.example.com
images:
  - name: ghcr.io/vulkreon/pokedex-go-api
    newTag: f048633da6a0bb5566379c57e8fd2afa0eb5277a
  - name: ghcr.io/vulkreon/pokedex-go-web
    newTag: f048633da6a0bb5566379c57e8fd2afa0eb5277a
