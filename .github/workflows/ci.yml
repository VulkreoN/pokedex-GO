name: CI / CD

# Every push and pull request: the full test battery (types, unit, API integration on a real Postgres, browser).
# Pushes to main, once green: Docker images to the GitHub Container Registry, then a release, either way:
#   Kubernetes + ArgoCD (deploy/k8s): the release commits the new image tag to deploy/k8s/kustomization.yaml and
#     ArgoCD rolls it out. Variable K8S_RELEASE=true.
#   A VPS with Docker Compose (deploy/README.md): over SSH. Secrets VPS_HOST, VPS_USER, VPS_SSH_KEY,
#     VPS_KNOWN_HOSTS, optional VPS_PORT.
# Either way, with the variable DOMAIN set, read-only checks then run against the live site once it serves the
# new version. Without any of these settings the release jobs are skipped, so forks and first pushes stay green.

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push cancels the run still going on the same branch, main included: only the latest commit is tested and
# released (it holds the earlier ones), instead of every push queueing a full run behind the previous one. A run
# cancelled during its release is harmless: the image tags are per commit, and release-k8s never rolls back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Game master, pictures list... downloaded by the test API; cached for the week to stay fast and polite.
      - id: week
        run: echo "n=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: apps/api/.data/cache
          key: data-sources-${{ steps.week.outputs.n }}
          restore-keys: data-sources-
      # The headless shell only (no full browser to download); cached between runs, system libraries installed each time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Browser for the end-to-end tests
        run: pnpm --filter @mydexpogo/e2e exec playwright install --with-deps --only-shell chromium
      - name: Test battery
        run: scripts/test-all.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results
          retention-days: 7

  # Built while the tests run (the release waits for both); only the commit's tag here, "latest" once tests pass.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the version's last number counts the changes since VERSION changed.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.name.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          # A slow or failing cache upload must not fail the build.
          cache-to: type=gha,mode=max,scope=${{ matrix.app }},ignore-error=true

  # The tested images become "latest" (what the Docker Compose setup pulls by default): a retag, no rebuild.
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for app in api web; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$app"
            docker buildx imagetools create -t "$image:latest" "$image:${GITHUB_SHA}"
          done

  release-k8s:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.K8S_RELEASE == 'true'
    needs: [test, images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The only change a release makes in Git: both images to this commit. ArgoCD picks it up.
      - name: Point deploy/k8s at this commit
        id: tag
        run: |
          # A newer push is on main: its own run releases it, this one must not roll back to an older image.
          if [ -n "$(git log --format=%s "${GITHUB_SHA}..HEAD" | grep -v '^release:' || true)" ]; then
            echo "newer commits on main, leaving the release to their run"; exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^(    newTag: ).*/\1${GITHUB_SHA}/" deploy/k8s/kustomization.yaml
          git diff --quiet && { echo "already at ${GITHUB_SHA}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
      - name: Wait for the new version to answer
        if: vars.DOMAIN != '' && steps.tag.outputs.released == 'true'
        run: |
          for i in $(seq 1 120); do
            if curl -fsS --max-time 5 "https://${{ vars.DOMAIN }}/api/health" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "live: ${GITHUB_SHA}"; exit 0
            fi
            sleep 10
          done
          echo "::error::https://${{ vars.DOMAIN }} still does not serve ${GITHUB_SHA} after 20 minutes: check the app in ArgoCD"
          exit 1
      - if: vars.DOMAIN != '' && steps.tag.outputs.released == 'true'
        uses: pnpm/action-setup@v4
      - if: vars.DOMAIN != '' && steps.tag.outputs.released == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Checks against the live site (read-only)
        if: vars.DOMAIN != '' && steps.tag.outputs.released == 'true'
        run: |
          pnpm install --frozen-lockfile --filter @mydexpogo/e2e
          pnpm --filter @mydexpogo/e2e exec playwright install --with-deps --only-shell chromium
          DEPLOY_URL=https://${{ vars.DOMAIN }} pnpm --filter @mydexpogo/e2e e2e:deploy

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, images, latest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - if: env.VPS_HOST == ''
        run: echo "::notice::No VPS_HOST secret yet, deploy skipped."
      - if: env.VPS_HOST != ''
        uses: actions/checkout@v4
      - name: SSH key
        if: env.VPS_HOST != ''
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Release on the VPS
        if: env.VPS_HOST != ''
        env:
          USER_AT: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT -o BatchMode=yes"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o BatchMode=yes deploy/docker-compose.prod.yml deploy/deploy.sh deploy/backup.sh "$USER_AT:/opt/mydexpogo/"
          $SSH "$USER_AT" "cd /opt/mydexpogo && chmod +x deploy.sh backup.sh && IMAGE_PREFIX=${IMAGE_PREFIX,,} ./deploy.sh ${{ github.sha }}"
      - if: env.VPS_HOST != '' && vars.DOMAIN != ''
        uses: pnpm/action-setup@v4
      - if: env.VPS_HOST != '' && vars.DOMAIN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Checks against the live site (read-only)
        if: env.VPS_HOST != '' && vars.DOMAIN != ''
        run: |
          pnpm install --frozen-lockfile --filter @mydexpogo/e2e
          pnpm --filter @mydexpogo/e2e exec playwright install --with-deps chromium
          DEPLOY_URL=https://${{ vars.DOMAIN }} pnpm --filter @mydexpogo/e2e e2e:deploy
