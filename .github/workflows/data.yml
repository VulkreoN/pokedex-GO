name: Refresh dataset

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:build -- --max-age=0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "dataset-bot"
          git config user.email "dataset-bot@users.noreply.github.com"
          git add apps/web/public/data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: refresh dataset $(date -u +%F)"
          git push
